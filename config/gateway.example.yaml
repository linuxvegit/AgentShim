server:
  bind: 127.0.0.1
  port: 8787
  keepalive_secs: 15
logging:
  format: pretty
  filter: info,agent_shim=debug
  # Optional file logging. When set, log events are written to a rolling
  # file in addition to stdout. Use an ABSOLUTE path on Windows (under
  # a service the cwd is C:\Windows\System32). Daily rotation with
  # 7-day retention is a reasonable default; tune for your platform.
  #
  # file:
  #   path: "/var/log/agent-shim/agent-shim.log"   # Linux
  #   # path: "C:\\ProgramData\\agent-shim\\logs\\agent-shim.log"   # Windows
  #   format: json
  #   rotation: daily     # daily | hourly | never
  #   max_files: 7
  #
  # Plan B Task 10: when true, the gateway prints the resolved model
  # catalog to stderr right after discovery completes. Identical text
  # to `agent-shim show-catalog`. Off by default — turn on if you want
  # a startup sanity check.
  # print_catalog_on_start: true
#
# Plan B Task 9: refuse to start if any route's `upstream_model` is not
# present in the discovered upstream catalog. Off by default because not
# every provider implements `/models`; turn on only when every upstream
# you reference does (e.g. Copilot, openai_compatible against a backend
# whose /v1/models is enumerable).
# validation:
#   strict_upstream_models: true
upstreams:
  # DeepSeek-as-backend (talks to api.deepseek.com directly):
  # Uses the native `deepseek` upstream type which adds:
  #   - `reasoning_content` interleaving for deepseek-reasoner (R1)
  #   - cache_hit / cache_miss usage mapping into the canonical Usage shape
  #   - defense-in-depth `cache_control` strip on outbound bodies
  deepseek:
    type: deepseek
    api_key: "sk-your-deepseek-api-key-here"
    tier: standard
    # Optional overrides (defaults shown):
    # base_url: https://api.deepseek.com/v1
    # request_timeout_secs: 30
    # default_headers: {}
  # Anthropic-as-backend (talks to api.anthropic.com directly):
  # anthropic:
  #   type: anthropic
  #   api_key: "sk-ant-your-key-here"
  #   tier: standard
  #   # Optional overrides:
  #   # base_url: https://api.anthropic.com
  #   # anthropic_version: "2023-06-01"
  #   # request_timeout_secs: 60
  # Gemini-as-backend (talks to generativelanguage.googleapis.com directly):
  # Uses the native `gemini` upstream type which supports:
  #   - JSON-array streaming on :streamGenerateContent (not SSE)
  #   - inlineData (base64) and fileData (URL) image inputs
  #   - functionDeclarations / functionCall / functionResponse for tools
  #   - thinkingConfig (budget tokens) for reasoning-capable models
  # gemini:
  #   type: gemini
  #   api_key: "AIzaSy-your-ai-studio-api-key-here"
  #   tier: standard
  #   # Optional overrides (defaults shown):
  #   # base_url: https://generativelanguage.googleapis.com/v1beta
  #   # request_timeout_secs: 30
  #   # default_headers: {}
  # Zhipu GLM (open.bigmodel.cn). OpenAI-Chat compatible with two quirks
  # handled by the gateway: `reasoning_effort` -> `thinking:{type:...}`,
  # SSE `reasoning_content` deltas surface as canonical Reasoning blocks.
  glm:
    type: glm
    api_key: "zhipu-your-glm-api-key-here"
    tier: standard
    # Optional overrides (defaults shown):
    # base_url: https://open.bigmodel.cn/api/paas/v4
    # request_timeout_secs: 30
    # default_headers: {}
  # Alternative: Z.AI exposes GLM through an Anthropic-Messages compatible
  # endpoint. No new upstream type needed — point the existing `anthropic`
  # provider at the Z.AI base URL.
  # zai:
  #   type: anthropic
  #   base_url: https://api.z.ai/api/anthropic
  #   api_key: "your-zai-api-key-here"
  #   tier: standard
routes:
  - frontend: openai_chat
    model: deepseek-chat
    upstream: deepseek
    upstream_model: deepseek-chat
  - frontend: openai_chat
    model: deepseek-reasoner
    upstream: deepseek
    upstream_model: deepseek-reasoner
    # Optional: default reasoning_effort applied when the request omits one.
    # One of: minimal | low | medium | high | xhigh | max
    # Forwarded to upstreams that understand `reasoning_effort`
    # (Copilot/GPT-5/o-series).
    reasoning_effort: medium

  # Per-route reasoning_mapping table — rewrite the canonical effort axis
  # before the request reaches the upstream. First matching rule wins;
  # unmatched passes through. Both `match` and `set` must be canonical
  # effort strings (`minimal/low/medium/high/xhigh/max`); unknown values
  # fail validation at config-load.
  #
  # Example: a Claude Code user who presses "ultrathink" sends
  # `output_config.effort: max`. On a Copilot-backed route, lift that to
  # Copilot's top tier (`xhigh`); also lift any plain `high` request to
  # `xhigh` for the same model.
  # - frontend: anthropic_messages
  #   model: claude-opus-4-7
  #   upstream: copilot
  #   upstream_model: claude-opus-4-7
  #   reasoning_mapping:
  #     - match: max
  #       set:   xhigh
  #     - match: high
  #       set:   xhigh

  # Anthropic 1M context — enabled via header, NOT a different model name.
  # Claude Code sends `anthropic-beta: context-1m-...` automatically; this
  # default kicks in only if the inbound request didn't supply one.
  # Uncomment after declaring a `copilot` upstream block above.
  # - frontend: anthropic_messages
  #   model: claude-opus-4-7
  #   upstream: copilot
  #   upstream_model: claude-opus-4-7
  #   anthropic_beta: context-1m-2025-08-07

  # Anthropic frontend → DeepSeek-Reasoner (visible thinking blocks).
  # DeepSeek-R1 emits `reasoning_content` deltas alongside regular
  # `content`; the parser routes both through the ReasoningInterleaver
  # so the Anthropic encoder renders reasoning as `thinking` events that
  # Claude Code displays as a "thinking" indicator.
  # - frontend: anthropic_messages
  #   model: deepseek-reasoner
  #   upstream: deepseek
  #   upstream_model: deepseek-reasoner

  # Anthropic frontend → Anthropic backend (byte-passthrough fast path)
  # - frontend: anthropic_messages
  #   model: claude-opus-4-7
  #   upstream: anthropic
  #   upstream_model: claude-opus-4-7

  # OpenAI Chat frontend → Anthropic backend (canonical translation)
  # - frontend: openai_chat
  #   model: claude-via-oai
  #   upstream: anthropic
  #   upstream_model: claude-opus-4-7

  # OpenAI Chat frontend → Gemini Flash (general use). Tool calls and JSON
  # mode work; vision works via base64 or URL image inputs.
  # - frontend: openai_chat
  #   model: gemini-2.0-flash
  #   upstream: gemini
  #   upstream_model: gemini-2.0-flash

  # Anthropic frontend → Gemini thinking model. Gemini emits `thought:true`
  # parts which the parser routes into canonical Reasoning blocks; the
  # Anthropic encoder renders them as `content_block_start type: thinking`.
  # The route-level reasoning_effort below maps to a thinking budget per the
  # docs/providers/gemini.md table (medium = 1024 tokens).
  # - frontend: anthropic_messages
  #   model: gemini-2.5-flash-thinking
  #   upstream: gemini
  #   upstream_model: gemini-2.5-flash-thinking
  #   reasoning_effort: medium

  # GLM via OpenAI Chat frontend. The `glm` provider injects
  # `thinking:{type:enabled}` based on the canonical reasoning_effort
  # (Minimal -> disabled, all other levels -> enabled) and strips the
  # OpenAI-style `reasoning_effort` field that Zhipu would reject.
  - frontend: openai_chat
    model: glm-5.1
    upstream: glm
    upstream_model: glm-5.1
