[package]
name = "agent-shim-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agent_shim_router"
path = "src/lib.rs"

[dependencies]
agent-shim-core = { path = "../core" }
agent-shim-config = { path = "../config" }
agent-shim-providers = { path = "../providers" }
governor = "0.6"
nonzero_ext = "0.3"
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
tokio = { workspace = true }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "small_rng"] }
sha2 = "0.10"
uuid = { workspace = true }
metrics.workspace = true

[dev-dependencies]
agent-shim-observability = { path = "../observability" }
proptest = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tracing-subscriber = { workspace = true }
