[package]
name = "agent-shim-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agent_shim_observability"
path = "src/lib.rs"

[dependencies]
agent-shim-config = { path = "../config" }
agent-shim-observability-derive = { path = "../observability-derive" }
linkme = "0.3"
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
tower.workspace = true
http = "1"
uuid.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
prometheus-parse.workspace = true
axum = { workspace = true, features = ["macros"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }
