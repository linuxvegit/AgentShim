[package]
name = "agent-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "agent-shim"

[lib]
name = "agent_shim_gateway"
path = "src/lib.rs"

[[bin]]
name = "agent-shim"
path = "src/main.rs"

[features]
# Enables nightly live end-to-end tests that call real upstream APIs
# (Anthropic, DeepSeek, Gemini). Compile-time gate: the `*_live.rs`
# integration tests are entirely `#![cfg(feature = "live")]`, so the
# default `cargo test --workspace` invocation never touches billed
# endpoints. The CI nightly workflow is the only place this is enabled.
# AGENT_SHIM_E2E + per-provider API keys are the runtime gate on top.
live = []

[dependencies]
agent-shim-core = { path = "../core" }
agent-shim-config = { path = "../config" }
agent-shim-observability = { path = "../observability" }
agent-shim-frontends = { path = "../frontends" }
agent-shim-providers = { path = "../providers" }
agent-shim-router = { path = "../router" }
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
tracing.workspace = true
clap.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
futures-util.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
dirs = "5"
parking_lot.workspace = true
reqwest.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
uuid.workspace = true
tracing-opentelemetry.workspace = true
prometheus-parse.workspace = true
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
mockito.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
futures.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# Plan 01 P01 T4/T5: outbound-traceparent integration tests install a
# minimal OTel-backed subscriber so root spans carry a valid OTel
# context and `inject_context_into_headers` produces a `traceparent`.
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "gateway_overhead"
harness = false
